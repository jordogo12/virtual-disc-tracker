<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jordogo12 | App Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Apple System Typography Stack */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            transition: background-color 0.3s cubic-bezier(0.16, 1, 0.3, 1), color 0.3s ease;
        }

        /* Dark Mode Theme Support */
        [data-theme="dark"] {
            background-color: #000000;
            color: #f5f5f7;
        }

        /* Glassmorphism Header */
        .apple-header {
            background-color: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        [data-theme="dark"] .apple-header {
            background-color: rgba(22, 22, 23, 0.75);
        }

        /* Apple Surface Cards */
        .apple-card {
            background-color: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.3s ease;
        }
        .apple-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }
        [data-theme="dark"] .apple-card {
            background-color: #1c1c1e;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        [data-theme="dark"] .apple-card:hover {
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        /* Pill Buttons */
        .apple-btn {
            background-color: #0071e3;
            color: #ffffff;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .apple-btn:hover {
            background-color: #0077ed;
        }
        .apple-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <header class="apple-header sticky top-0 z-50 border-b border-black/5 dark:border-white/10 px-6 py-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div>
                <p class="label text-[11px] font-medium uppercase tracking-wider text-gray-500 dark:text-gray-400">System Version: 1.8.2</p>
                <h1 class="text-xl font-semibold tracking-tight">jordogo12 <span class="font-normal text-gray-400 dark:text-gray-500">//</span> APPS</h1>
            </div>
            <div class="flex items-center gap-6">
                <div class="text-right hidden sm:block">
                    <p class="label text-[11px] font-medium uppercase tracking-wider text-gray-500 dark:text-gray-400">Archive_Status</p>
                    <p class="value text-sm font-medium text-gray-800 dark:text-gray-200">Index: 05</p>
                </div>
                <button class="te-key orange w-8 h-8 rounded-full bg-orange-500/10 hover:bg-orange-500/20 text-orange-500 flex items-center justify-center transition-all active:scale-95" onclick="toggleTheme()" aria-label="Toggle Theme">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="5" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto w-full px-6 py-12 flex-grow">
        <div class="te-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="te-panel apple-card rounded-2xl p-6 flex flex-col justify-between h-56 shadow-sm">
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <p class="label text-[11px] font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500">Mod_01 // WIP</p>
                        <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                    </div>
                    <p class="value text-2xl font-semibold tracking-tight mb-1">VR Trakr</p>
                    <p class="text-xs text-gray-500 dark:text-gray-400 leading-relaxed">Beautiful disc golf score tracking.</p>
                </div>
                <div class="flex justify-between items-center pt-4 border-t border-gray-100 dark:border-white/5">
                    <p class="label text-xs font-medium text-gray-400 dark:text-gray-500">Status: WIP</p>
                    <a href="./dg-trakr/dg-trakr.html" class="te-key apple-btn w-9 h-9 rounded-full flex items-center justify-center font-medium shadow-sm text-sm">
                        →
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="max-w-5xl mx-auto w-full px-6 py-8 border-t border-black/5 dark:border-white/10 flex justify-between items-center">
        <div>
            <p class="label text-xs font-medium text-gray-500 dark:text-gray-400">Logic</p>
            <p class="text-[11px] text-gray-400 dark:text-gray-500 mt-0.5">Utility Software Archive // v1.8.2</p>
        </div>
    </footer>

    <script>
        // Load preference
        let currentTheme = localStorage.getItem('te_theme') || 'light';
        if (currentTheme === 'dark') document.body.setAttribute('data-theme', 'dark');

        function toggleTheme() {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                localStorage.setItem('te_theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                localStorage.setItem('te_theme', 'dark');
            }
        }
    </script>
</body>
</html>
