<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body class="antialiased"> <header>
        <div>
            <p class="label">System Version: 1.8.2</p>
            <h1 class="text-2xl font-semibold tracking-tight">TERABYTE_EXE // APPS</h1>
        </div>
        <div class="flex gap-4 items-center">
            <div class="text-right">
                <p class="label">Archive_Status</p>
                <p class="value">Index: 05</p>
            </div>
            <button class="te-key orange" onclick="toggleTheme()" aria-label="Toggle Theme">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            </button>
        </div>
    </header>

    <main class="te-grid mt-6">
        <div class="te-panel">
            <div>
                <p class="label">Mod_01 // WIP</p>
                <p class="value text-xl">DG_Trakr</p>
                <p class="text-sm mt-2 text-gray-500 dark:text-gray-400">Beautiful disc golf score tracking.</p>
            </div>
            <div class="flex justify-between items-end">
                <p class="label">Status: WIP</p>
                <a href="./dg-trakr/dg-trakr.html" class="te-key">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </a>
            </div>
        </div>
    </main>

    <footer class="flex gap-10">
        <div>
            <p class="label">Logic</p>
            <p class="text-xs mt-1 text-gray-500 dark:text-gray-400">Utility Software Archive // v1.8.2</p>
        </div>
    </footer>

    <script>
        // Load preference
        let currentTheme = localStorage.getItem('te_theme') || 'light';
        if (currentTheme === 'dark') document.body.setAttribute('data-theme', 'dark');

        function toggleTheme() {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                localStorage.setItem('te_theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                localStorage.setItem('te_theme', 'dark');
            }
        }
    </script>
</body>
</html>
